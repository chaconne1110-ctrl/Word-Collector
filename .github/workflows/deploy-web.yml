name: Deploy Word Collector web

on:
  push:
    branches:
      - feature/cloudflare-gemini35
    paths:
      - 'www/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: word-collector-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/feature/cloudflare-gemini35'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only public application files
        uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - name: Deploy web application
        id: deployment
        uses: actions/deploy-pages@v4
