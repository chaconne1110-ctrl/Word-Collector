name: Build v2.3 three-notebook Android debug APK (no deploy)

on:
  push:
    branches:
      - integrate/consolidated-chat-priority-20261113
      - 'v[0-9]*'
      - v2.3-three-notebooks
    paths:
      - '.github/workflows/build-chat-priority-apk.yml'
      - 'android-seeds/three-notebooks-data.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test-apk:
    name: Validate and build exact branch snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout requested branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact requested branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v2.3-three-notebooks"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -s android-seeds/three-notebooks-data.js
          grep -q '"appId":  *"com.yechan.wordcollector"' capacitor.config.json
          grep -q '"webDir":  *"www"' capacitor.config.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install exact application dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check www/analysis-api.js
          node --check www/quick_capture/analysis.js
          node --check www/sw.js
          node --check cloudflare/worker.mjs

      - name: Run regression tests (no paid Gemini API calls)
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/*.test.mjs

      - name: Verify v2.3 source snapshot, three subjects and word counts
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const src = fs.readFileSync('android-seeds/three-notebooks-data.js','utf8');
          const sandbox = {};
          vm.createContext(sandbox);
          vm.runInContext(src + '\n;globalThis.result = seed;', sandbox);
          const seed = sandbox.result;
          const names = ['전력공학','회로이론','전기기기'];
          const ids = Object.keys(seed.courses);
          if (JSON.stringify(ids.map(id => seed.courses[id][0])) !== JSON.stringify(names)) throw Error('Incorrect notebook names');
          if (Object.keys(seed.terms).length !== 72) throw Error('Expected exactly 72 words');
          if (seed.saved.length !== 0) throw Error('No default bookmarks expected');
          for (const id of ids) {
            const count = Object.values(seed.terms).filter(term => term.course === id).length;
            if (count !== 24) throw Error('Expected 24 terms per notebook: ' + id + ' actual ' + count);
          }
          const base = fs.readFileSync('www/data.js', 'utf8');
          if (!base.includes('courses: {}, terms: {}, saved: []')) throw Error('Original v2.3 app data unexpectedly modified');
          console.log('PASS: original v2.3 app + 3 subjects / 72 words for APK only');
          NODE

      - name: Sync branch www assets into Android
        run: npx --no-install cap sync android

      - name: Bundle the seed and isolate Android application ID
        shell: bash
        run: |
          set -euo pipefail
          cp android-seeds/three-notebooks-data.js android/app/src/main/assets/public/data.js
          sed -i 's/applicationId "com.yechan.wordcollector"/applicationId "com.yechan.wordcollector.three"/' android/app/build.gradle
          sed -i 's/<string name="app_name">Word Collector</<string name="app_name">Word Collector 3전공</' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">Word Collector</<string name="title_activity_main">Word Collector 3전공</' android/app/src/main/res/values/strings.xml
          test -s android/app/src/main/assets/public/data.js
          cmp android-seeds/three-notebooks-data.js android/app/src/main/assets/public/data.js
          grep -q 'applicationId "com.yechan.wordcollector.three"' android/app/build.gradle
          grep -q 'Word Collector 3전공' android/app/src/main/res/values/strings.xml

      - name: Check bundled UI and authentication mode
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/analysis-api.js
          test -s android/app/src/main/assets/public/quick_capture/code.html
          grep -q 'id="analysis-action-bar"' android/app/src/main/assets/public/quick_capture/code.html
          ! grep -q 'id="tester-token"' android/app/src/main/assets/public/quick_capture/code.html

      - name: Build Android debug APK
        run: bash android/gradlew -p android assembleDebug --max-workers=2 --console=plain

      - name: Package APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHORT_SHA="${GITHUB_SHA:0:9}"
          NAME="WordCollector_v2.3_ThreeNotebooks_${SHORT_SHA}_Debug.apk"
          mkdir -p release
          cp "$APK" "release/$NAME"
          (cd release && sha256sum "$NAME" > SHA256.txt)
          {
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Android App ID: com.yechan.wordcollector.three"
            echo "Base source: v2.3 05e5c3eb2ddef20013784919d2ed8f3c908f37e2"
            echo "Bundled data: 전력공학 24 + 회로이론 24 + 전기기기 24"
            echo "Variant: debug test build, not production signed"
            echo "No Cloudflare Worker or GitHub Pages deployment was performed"
            echo "Do not uninstall an existing app or clear its data to switch signing keys"
          } > release/BUILD_INFO.txt

      - name: Upload downloadable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: wordcollector-v2.3-three-notebooks-debug-apk
          path: |
            release/*.apk
            release/SHA256.txt
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30
