name: Build and publish Word Collector v6.2 Android debug APK

on:
  push:
    branches:
      - integrate/consolidated-chat-priority-20261113
      - 'v[0-9]*'
      - V11.21
    paths:
      - '.github/workflows/build-chat-priority-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-test-apk:
    name: Validate and build exact branch snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout requested branch commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify exact requested branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v6.2"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          grep -q '"appId":  *"com.yechan.wordcollector"' capacitor.config.json
          grep -q '"webDir":  *"www"' capacitor.config.json
          test "$(git rev-parse HEAD:www/analysis-api.js)" = "52a1ab89729703135bf2ecbe26ea3fa959dfba75"
          grep -Fq "https://word-collector-api-v3.yechan-lim-elec.workers.dev" www/analysis-api.js
          grep -Fq "https://word-collector-api-v3.yechan-lim-elec.workers.dev" www/anonymous-auth.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install exact application dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check www/app.js
          node --check www/analysis-api.js
          node --check www/quick_capture/analysis.js
          node --check www/sw.js
          node --check cloudflare/worker.mjs

      - name: Run regression tests (no paid Gemini API calls)
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/*.test.mjs

      - name: Sync branch www assets into Android
        run: npx --no-install cap sync android

      - name: Check bundled UI and authentication mode
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/analysis-api.js
          test -s android/app/src/main/assets/public/quick_capture/code.html
          grep -q 'id="analysis-action-bar"' android/app/src/main/assets/public/quick_capture/code.html
          ! grep -q 'id="tester-token"' android/app/src/main/assets/public/quick_capture/code.html

      - name: Isolate v6.2 Android installation and validate bundled v3 API
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' android/app/src/main/assets/public/analysis-api.js
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' android/app/src/main/assets/public/anonymous-auth.js
          sed -i 's/applicationId "com.yechan.wordcollector"/applicationId "com.yechan.wordcollector.v62"/' android/app/build.gradle
          sed -i 's/<string name="app_name">Word Collector</<string name="app_name">Word Collector v6.2</' android/app/src/main/res/values/strings.xml
          sed -i 's/<string name="title_activity_main">Word Collector</<string name="title_activity_main">Word Collector v6.2</' android/app/src/main/res/values/strings.xml
          grep -q 'applicationId "com.yechan.wordcollector.v62"' android/app/build.gradle
          grep -q 'Word Collector v6.2' android/app/src/main/res/values/strings.xml

      - name: Build Android debug APK
        run: bash android/gradlew -p android assembleDebug --max-workers=2 --console=plain

      - name: Package APK and checksums
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SHORT_SHA="${GITHUB_SHA:0:9}"
          NAME="WordCollector_v6.2_${SHORT_SHA}_Debug.apk"
          TAG="word-collector-v6.2-debug-${SHORT_SHA}"
          mkdir -p release
          cp "$APK" "release/$NAME"
          (cd release && sha256sum "$NAME" > SHA256.txt)
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"
          {
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Android App ID: com.yechan.wordcollector.v62"
            echo "Underlying v6.2 application source: 20cd349a043a61d4be96769b999f6419c7e7737d"
            echo "Analysis API: word-collector-api-v3.yechan-lim-elec.workers.dev"
            echo "Variant: debug test build, not production signed"
            echo "No Cloudflare Worker or GitHub Pages deployment was performed"
            echo "Do not uninstall an existing app or clear its data to switch signing keys"
          } > release/BUILD_INFO.txt

      - name: Upload downloadable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: wordcollector-v6.2-debug-apk
          path: |
            release/*.apk
            release/SHA256.txt
            release/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public v6.2 Android APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release/$RELEASE_NAME" release/SHA256.txt release/BUILD_INFO.txt \
            --target "$GITHUB_SHA" \
            --title "Word Collector v6.2 Android APK ($RELEASE_TAG)" \
            --notes "Word Collector v6.2 snapshot (20cd349a app source; workflow-only build commit). Three seeded notebooks, 72 terms, v3 AI server. Debug test APK with isolated Android package com.yechan.wordcollector.v62 to protect previous installations. On-device install and live AI calls not verified." \
            --prerelease
