name: Redeploy approved Word Collector V11.17 snapshot + evaluation apps

# Site root: the approved V11.17 snapshot (unchanged). Each evaluation form
# (Word file) has its own branch and is published under eval/<slug>/, with the
# words of that form already analysed in the notebook "평가 단어 목록".
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-requested-chat-priority-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: word-collector-pages
  cancel-in-progress: false

jobs:
  deploy-requested-snapshot:
    name: Revalidate pinned snapshots and redeploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned requested branch revision
        uses: actions/checkout@v4
        with:
          ref: 'ccdac5a98805086f96db59fb5018b57e99298ca2'
          persist-credentials: false

      - name: Checkout evaluation app circuit-theory (회로이론_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '6e92064cb6892689e6d87d360ea1995f8a1aa539'
          path: eval-src/circuit-theory
          persist-credentials: false
      - name: Checkout evaluation app electric-machines (전기기기_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: 'c51f2449d86eb7897490084bf1768c8891c6a18e'
          path: eval-src/electric-machines
          persist-credentials: false
      - name: Checkout evaluation app electrical-safety (전기안전공학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '0455a5a71e37b4e9668abed535e71cf7704a026f'
          path: eval-src/electrical-safety
          persist-credentials: false
      - name: Checkout evaluation app electromagnetics (전기자기학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '3ca44248015f490275be6eff278a12d673642b4d'
          path: eval-src/electromagnetics
          persist-credentials: false
      - name: Checkout evaluation app power-engineering (전력공학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '73dcfcf616a4ac87f596e8d75755a164bb7cb72e'
          path: eval-src/power-engineering
          persist-credentials: false
      - name: Checkout evaluation app additional-experts (Word_Collector_추가_전문가_평가표)
        uses: actions/checkout@v4
        with:
          ref: 'a213f65624c2f978110911695e7dd862fc628640'
          path: eval-src/additional-experts
          persist-credentials: false

      - name: Verify immutable source revisions and app assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ccdac5a98805086f96db59fb5018b57e99298ca2"
          test -s www/index.html
          test -s www/quick_capture/code.html
          test -s www/analysis-api.js
          test -s www/sw.js
          grep -q 'id="analysis-action-bar"' www/quick_capture/code.html
          ! grep -q 'id="tester-token"' www/quick_capture/code.html
          test "$(git -C eval-src/circuit-theory rev-parse HEAD)" = "6e92064cb6892689e6d87d360ea1995f8a1aa539"
          grep -q "lexicon-word-collector-v1-eval-circuit-theory" eval-src/circuit-theory/www/app.js
          node --check eval-src/circuit-theory/www/data.js
          test "$(git -C eval-src/electric-machines rev-parse HEAD)" = "c51f2449d86eb7897490084bf1768c8891c6a18e"
          grep -q "lexicon-word-collector-v1-eval-electric-machines" eval-src/electric-machines/www/app.js
          node --check eval-src/electric-machines/www/data.js
          test "$(git -C eval-src/electrical-safety rev-parse HEAD)" = "0455a5a71e37b4e9668abed535e71cf7704a026f"
          grep -q "lexicon-word-collector-v1-eval-electrical-safety" eval-src/electrical-safety/www/app.js
          node --check eval-src/electrical-safety/www/data.js
          test "$(git -C eval-src/electromagnetics rev-parse HEAD)" = "3ca44248015f490275be6eff278a12d673642b4d"
          grep -q "lexicon-word-collector-v1-eval-electromagnetics" eval-src/electromagnetics/www/app.js
          node --check eval-src/electromagnetics/www/data.js
          test "$(git -C eval-src/power-engineering rev-parse HEAD)" = "73dcfcf616a4ac87f596e8d75755a164bb7cb72e"
          grep -q "lexicon-word-collector-v1-eval-power-engineering" eval-src/power-engineering/www/app.js
          node --check eval-src/power-engineering/www/data.js
          test "$(git -C eval-src/additional-experts rev-parse HEAD)" = "a213f65624c2f978110911695e7dd862fc628640"
          grep -q "lexicon-word-collector-v1-eval-additional-experts" eval-src/additional-experts/www/app.js
          node --check eval-src/additional-experts/www/data.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source JS
        run: |
          node --check www/screen-scale.js
          node --check www/app.js
          node --check www/analysis-api.js
          node --check www/quick_capture/analysis.js
          node --check www/anonymous-auth.js
          node --check www/sw.js
          node --check www/evidence.js
          node --check www/native-back.js

      - name: Run regression tests with mocked API (no Gemini charges)
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/*.test.mjs

      - name: Assemble site (root = V11.17, eval/<slug>/ = evaluation apps)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/eval
          cp -R www/. site/
          cp -R eval-src/circuit-theory/www site/eval/circuit-theory
          cp -R eval-src/electric-machines/www site/eval/electric-machines
          cp -R eval-src/electrical-safety/www site/eval/electrical-safety
          cp -R eval-src/electromagnetics/www site/eval/electromagnetics
          cp -R eval-src/power-engineering/www site/eval/power-engineering
          cp -R eval-src/additional-experts/www site/eval/additional-experts
          ls site/eval

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public web assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-attempt-${{ github.run_attempt }}

      - name: Deploy approved web snapshot to existing Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}

      - name: Summarize deployment
        shell: bash
        run: |
          echo "Root: V11.17 ccdac5a98805086f96db59fb5018b57e99298ca2"
          echo "회로이론_교수님_평가표: ${{ steps.deployment.outputs.page_url }}eval/circuit-theory/ (6e92064)"
          echo "전기기기_교수님_평가표: ${{ steps.deployment.outputs.page_url }}eval/electric-machines/ (c51f244)"
          echo "전기안전공학_교수님_평가표: ${{ steps.deployment.outputs.page_url }}eval/electrical-safety/ (0455a5a)"
          echo "전기자기학_교수님_평가표: ${{ steps.deployment.outputs.page_url }}eval/electromagnetics/ (3ca4424)"
          echo "전력공학_교수님_평가표: ${{ steps.deployment.outputs.page_url }}eval/power-engineering/ (73dcfcf)"
          echo "Word_Collector_추가_전문가_평가표: ${{ steps.deployment.outputs.page_url }}eval/additional-experts/ (a213f65)"
