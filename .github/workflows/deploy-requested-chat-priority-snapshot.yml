name: Deploy Word Collector existing apps plus V11.21 and v6.2 snapshots

# Requested 2026-11-25: add v6.2 (20cd349: bundled offline study photos, page icons) at /v6.2/ with its own storage; every existing app unchanged.

# Requested 2026-11-22: /v3/ now serves v3.4 (1e22ce9: new logo, three first-run notebooks, review order, backup fix); same v3-standalone storage keys and cache prefix. Root, six evaluation apps and v2.3 variant unchanged.
# Requested 2026-11-22: the six evaluation apps now call the v3 analysis server (word-collector-api-v3); their screens and words are unchanged. Root and v2.3 variant unchanged.
# Re-publish requested 2026-11-20: power-engineering evaluation URL; keep all other snapshots unchanged.
# Requested 2026-11-20: deploy newest v1 as root plus six most recently uploaded evaluation branches.
# Site root: verified v1 commit (adds word-list scroll restoration). Each evaluation form
# (Word file) has its own branch and is published under eval/<slug>/, with the
# words of that form already analysed in the notebook "평가 단어 목록".
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-requested-chat-priority-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: word-collector-pages
  cancel-in-progress: false

jobs:
  deploy-requested-snapshot:
    name: Revalidate pinned snapshots and redeploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned requested branch revision
        uses: actions/checkout@v4
        with:
          ref: '47bb6b5f0b9eb83aa88ffceb2f41c112f7abcb4b'
          persist-credentials: false

      - name: Checkout evaluation app circuit-theory (회로이론_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '06903b7842ea6cdb1f90664049824ceffc873aaf'
          path: eval-src/circuit-theory
          persist-credentials: false
      - name: Checkout evaluation app electric-machines (전기기기_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '59815dedb19e95540c11b25df0928f40daa7c371'
          path: eval-src/electric-machines
          persist-credentials: false
      - name: Checkout evaluation app electrical-safety (전기안전공학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: '7abb723b42e62797fa36419ab1857cbf72b9c06c'
          path: eval-src/electrical-safety
          persist-credentials: false
      - name: Checkout evaluation app electromagnetics (전기자기학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: 'f17b885dd83cfd7f25e3a47794343f34342bf261'
          path: eval-src/electromagnetics
          persist-credentials: false
      - name: Checkout evaluation app power-engineering (전력공학_교수님_평가표)
        uses: actions/checkout@v4
        with:
          ref: 'c9e918f641b1064cee802ef051eeac227c2a6aeb'
          path: eval-src/power-engineering
          persist-credentials: false
      - name: Checkout evaluation app additional-experts (Word_Collector_추가_전문가_평가표)
        uses: actions/checkout@v4
        with:
          ref: '6b8feb2c4a77b1675ea5de29467d7cc6899738cd'
          path: eval-src/additional-experts
          persist-credentials: false

      - name: Checkout pinned v2.3 three-notebook webapp variant
        uses: actions/checkout@v4
        with:
          ref: '64e12a8fd05f0194f5a3ac6928745e0e2fc098a6'
          path: variant-src/v23-three
          persist-credentials: false

      - name: Checkout pinned Word Collector v3 source
        uses: actions/checkout@v4
        with:
          ref: '1e22ce9780a5dedb566c5af6f0925b7d85666464'
          path: variant-src/v3
          persist-credentials: false

      - name: Checkout pinned V11.21 webapp source
        uses: actions/checkout@v4
        with:
          ref: '157eee1d97128432b8d40a9e340d1ac24c640965'
          path: variant-src/v1121
          persist-credentials: false

      - name: Checkout pinned v6.2 webapp source
        uses: actions/checkout@v4
        with:
          ref: '20cd349a043a61d4be96769b999f6419c7e7737d'
          path: variant-src/v62
          persist-credentials: false

      - name: Verify immutable source revisions and app assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "47bb6b5f0b9eb83aa88ffceb2f41c112f7abcb4b"
          test -s www/index.html
          test -s www/quick_capture/code.html
          test -s www/analysis-api.js
          test -s www/sw.js
          grep -q 'id="analysis-action-bar"' www/quick_capture/code.html
          ! grep -q 'id="tester-token"' www/quick_capture/code.html
          test "$(git -C eval-src/circuit-theory rev-parse HEAD)" = "06903b7842ea6cdb1f90664049824ceffc873aaf"
          grep -q "lexicon-word-collector-v1-eval-circuit-theory" eval-src/circuit-theory/www/app.js
          node --check eval-src/circuit-theory/www/data.js
          test "$(git -C eval-src/electric-machines rev-parse HEAD)" = "59815dedb19e95540c11b25df0928f40daa7c371"
          grep -q "lexicon-word-collector-v1-eval-electric-machines" eval-src/electric-machines/www/app.js
          node --check eval-src/electric-machines/www/data.js
          test "$(git -C eval-src/electrical-safety rev-parse HEAD)" = "7abb723b42e62797fa36419ab1857cbf72b9c06c"
          grep -q "lexicon-word-collector-v1-eval-electrical-safety" eval-src/electrical-safety/www/app.js
          node --check eval-src/electrical-safety/www/data.js
          test "$(git -C eval-src/electromagnetics rev-parse HEAD)" = "f17b885dd83cfd7f25e3a47794343f34342bf261"
          grep -q "lexicon-word-collector-v1-eval-electromagnetics" eval-src/electromagnetics/www/app.js
          node --check eval-src/electromagnetics/www/data.js
          test "$(git -C eval-src/power-engineering rev-parse HEAD)" = "c9e918f641b1064cee802ef051eeac227c2a6aeb"
          grep -q "lexicon-word-collector-v1-eval-power-engineering" eval-src/power-engineering/www/app.js
          node --check eval-src/power-engineering/www/data.js
          test "$(git -C eval-src/additional-experts rev-parse HEAD)" = "6b8feb2c4a77b1675ea5de29467d7cc6899738cd"
          grep -q "lexicon-word-collector-v1-eval-additional-experts" eval-src/additional-experts/www/app.js
          node --check eval-src/additional-experts/www/data.js
          test "$(git -C variant-src/v23-three rev-parse HEAD)" = "64e12a8fd05f0194f5a3ac6928745e0e2fc098a6"
          test -s variant-src/v23-three/www/index.html
          test -s variant-src/v23-three/android-seeds/three-notebooks-data.js
          node --check variant-src/v23-three/www/app.js
          node --check variant-src/v23-three/www/analysis-api.js
          node --check variant-src/v23-three/android-seeds/three-notebooks-data.js
          test "$(git -C variant-src/v3 rev-parse HEAD)" = "1e22ce9780a5dedb566c5af6f0925b7d85666464"
          test -s variant-src/v3/www/index.html
          node --check variant-src/v3/www/app.js
          node --check variant-src/v3/www/analysis-api.js
          test "$(git -C variant-src/v1121 rev-parse HEAD)" = "157eee1d97128432b8d40a9e340d1ac24c640965"
          test -s variant-src/v1121/www/index.html
          node --check variant-src/v1121/www/app.js
          node --check variant-src/v1121/www/data.js
          node --check variant-src/v1121/www/analysis-api.js
          node --check variant-src/v1121/www/sw.js
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' variant-src/v1121/www/analysis-api.js
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' variant-src/v1121/www/anonymous-auth.js
          test "$(git -C variant-src/v62 rev-parse HEAD)" = "20cd349a043a61d4be96769b999f6419c7e7737d"
          test -s variant-src/v62/www/index.html
          node --check variant-src/v62/www/app.js
          node --check variant-src/v62/www/data.js
          node --check variant-src/v62/www/sw.js
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sandbox = {};
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('variant-src/v1121/www/data.js','utf8') + '\n;globalThis.firstRunSeed = seed;',sandbox);
          const seed = sandbox.firstRunSeed;
          const ids = Object.keys(seed.courses);
          if (JSON.stringify(ids.map(id => seed.courses[id][0])) !== JSON.stringify(['전력공학','회로이론','전기기기'])) throw Error('V11.21 notebook titles unexpected');
          if (Object.keys(seed.terms).length !== 72) throw Error('V11.21 expected 72 terms');
          for(const id of ids) if(Object.values(seed.terms).filter(term=>term.course===id).length !== 24) throw Error('V11.21 expected 24 terms each');
          NODE
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' variant-src/v3/www/analysis-api.js
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' variant-src/v3/www/anonymous-auth.js
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const source = fs.readFileSync('variant-src/v23-three/android-seeds/three-notebooks-data.js','utf8');
          const scope = {};
          vm.createContext(scope);
          vm.runInContext(source + '\n;globalThis.result = seed;',scope);
          const seed = scope.result;
          const ids = Object.keys(seed.courses);
          const expected = ['전력공학','회로이론','전기기기'];
          if (JSON.stringify(ids.map(id=>seed.courses[id][0])) !== JSON.stringify(expected)) throw Error('Wrong seeded notebook list');
          if (Object.keys(seed.terms).length !== 72) throw Error('Expected 72 words');
          for (const id of ids) {
            if (Object.values(seed.terms).filter(term=>term.course===id).length !== 24) throw Error('Wrong words for '+id);
          }
          console.log('Verified three isolated notebooks and 72 words');
          NODE


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source JS
        run: |
          node --check www/screen-scale.js
          node --check www/app.js
          node --check www/analysis-api.js
          node --check www/quick_capture/analysis.js
          node --check www/anonymous-auth.js
          node --check www/sw.js
          node --check www/evidence.js
          node --check www/native-back.js

      - name: Run regression tests with mocked API (no Gemini charges)
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/*.test.mjs

      - name: Assemble site (root = v1, eval/<slug>/ = evaluation apps)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/eval
          cp -R www/. site/
          cp -R eval-src/circuit-theory/www site/eval/circuit-theory
          cp -R eval-src/electric-machines/www site/eval/electric-machines
          cp -R eval-src/electrical-safety/www site/eval/electrical-safety
          cp -R eval-src/electromagnetics/www site/eval/electromagnetics
          cp -R eval-src/power-engineering/www site/eval/power-engineering
          cp -R eval-src/additional-experts/www site/eval/additional-experts
          ls site/eval
          # Separate v2.3 webapp: publish at its own path without changing the 7 existing apps.
          mkdir -p site/v2.3-three-notebooks
          cp -R variant-src/v23-three/www/. site/v2.3-three-notebooks/
          cp variant-src/v23-three/android-seeds/three-notebooks-data.js site/v2.3-three-notebooks/data.js
          # A GitHub Pages project shares an origin across subpaths. Isolate all
          # user data, transient capture state, AI photo databases and SW caches.
          find site/v2.3-three-notebooks -type f \( -name '*.js' -o -name '*.html' \) -print0 |
            xargs -0 sed -i \
              -e 's/lexicon-word-collector-v1/lexicon-word-collector-v23-three/g' \
              -e 's/wc-list-scroll-v1/wc-list-scroll-v23-three/g' \
              -e 's/word-collector-capture-request-v1/word-collector-capture-request-v23-three/g' \
              -e 's/word-collector-capture-started-v1/word-collector-capture-started-v23-three/g' \
              -e 's/wordcollector-photo-store-v1/wordcollector-photo-store-v23-three/g' \
              -e 's/word-collector-private-auth-v1/word-collector-private-auth-v23-three/g' \
              -e 's/word-collector-web-tester-session-v1/word-collector-web-tester-session-v23-three/g' \
              -e 's/word-collector-device-id-v1/word-collector-device-id-v23-three/g' \
              -e 's/word-collector-tester-auth-v1/word-collector-tester-auth-v23-three/g' \
              -e 's/wordcollector-public-static-/wordcollector-three-static-/g'
          test -s site/v2.3-three-notebooks/index.html
          grep -Fq "lexicon-word-collector-v23-three" site/v2.3-three-notebooks/app.js
          ! grep -Fq "lexicon-word-collector-v1" site/v2.3-three-notebooks/app.js
          grep -Fq "wordcollector-three-static-" site/v2.3-three-notebooks/sw.js
          node --check site/v2.3-three-notebooks/app.js
          node --check site/v2.3-three-notebooks/data.js
          node --check site/v2.3-three-notebooks/sw.js
          test "$(find site/eval -mindepth 1 -maxdepth 1 -type d | wc -l)" = 6
          ls -ld site/v2.3-three-notebooks site/eval/*
          # Standalone v3 URL; original root, six evaluator apps and v2.3 stay intact.
          mkdir -p site/v3
          cp -R variant-src/v3/www/. site/v3/
          # All Pages paths share one origin, so isolate the v3 browser data
          # from existing Word Collector versions without altering v3 app logic.
          find site/v3 -type f \( -name '*.js' -o -name '*.html' \) -print0 |
            xargs -0 sed -i \
              -e 's/lexicon-word-collector-v1/lexicon-word-collector-v3-standalone/g' \
              -e 's/wc-list-scroll-v1/wc-list-scroll-v3-standalone/g' \
              -e 's/word-collector-capture-request-v1/word-collector-capture-request-v3-standalone/g' \
              -e 's/word-collector-capture-started-v1/word-collector-capture-started-v3-standalone/g' \
              -e 's/wordcollector-photo-store-v1/wordcollector-photo-store-v3-standalone/g' \
              -e 's/word-collector-private-auth-v1/word-collector-private-auth-v3-standalone/g' \
              -e 's/word-collector-web-tester-session-v1/word-collector-web-tester-session-v3-standalone/g' \
              -e 's/word-collector-device-id-v1/word-collector-device-id-v3-standalone/g' \
              -e 's/word-collector-tester-auth-v1/word-collector-tester-auth-v3-standalone/g' \
              -e 's/wordcollector-public-static-/wordcollector-v3-public-static-/g'
          test -s site/v3/index.html
          grep -Fq "lexicon-word-collector-v3-standalone" site/v3/app.js
          grep -Fq "wordcollector-v3-public-static-" site/v3/sw.js
          grep -Fq "word-collector-api-v3.yechan-lim-elec.workers.dev" site/v3/analysis-api.js
          ! grep -Fq 'lexicon-word-collector-v1' site/v3/app.js
          node --check site/v3/app.js
          node --check site/v3/analysis-api.js
          node --check site/v3/sw.js
          test -s site/v2.3-three-notebooks/index.html
          test "$(find site/eval -mindepth 1 -maxdepth 1 -type d | wc -l)" = 6

          # New V11.21 app at its own path; preserve root, six evaluations, v2.3 and v3.4.
          mkdir -p site/V11.21
          cp -R variant-src/v1121/www/. site/V11.21/
          # GitHub Pages subpaths share an origin: isolate browser records,
          # anonymous credentials, images, transient states and SW caches.
          find site/V11.21 -type f \( -name '*.js' -o -name '*.html' \) -print0 |
            xargs -0 sed -i \
              -e 's/lexicon-word-collector-v1/lexicon-word-collector-v1121-standalone/g' \
              -e 's/wc-list-scroll-v1/wc-list-scroll-v1121-standalone/g' \
              -e 's/word-collector-capture-request-v1/word-collector-capture-request-v1121-standalone/g' \
              -e 's/word-collector-capture-started-v1/word-collector-capture-started-v1121-standalone/g' \
              -e 's/wordcollector-photo-store-v1/wordcollector-photo-store-v1121-standalone/g' \
              -e 's/word-collector-private-auth-v1/word-collector-private-auth-v1121-standalone/g' \
              -e 's/word-collector-web-tester-session-v1/word-collector-web-tester-session-v1121-standalone/g' \
              -e 's/word-collector-device-id-v1/word-collector-device-id-v1121-standalone/g' \
              -e 's/word-collector-tester-auth-v1/word-collector-tester-auth-v1121-standalone/g' \
              -e 's/wordcollector-public-static-/wordcollector-v1121-static-/g'
          test -s site/V11.21/index.html
          grep -Fq "lexicon-word-collector-v1121-standalone" site/V11.21/app.js
          ! grep -Fq 'lexicon-word-collector-v1' site/V11.21/app.js
          grep -Fq 'wordcollector-v1121-static-' site/V11.21/sw.js
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' site/V11.21/analysis-api.js
          node --check site/V11.21/app.js
          node --check site/V11.21/data.js
          node --check site/V11.21/sw.js
          test -s site/v3/index.html
          test -s site/v2.3-three-notebooks/index.html
          test "$(find site/eval -mindepth 1 -maxdepth 1 -type d | wc -l)" = 6

          # v6.2 (current app, 20cd349) at its own path; root, six evaluations, v2.3, v3.4 and V11.21 unchanged.
          mkdir -p site/v6.2
          cp -R variant-src/v62/www/. site/v6.2/
          # Pages subpaths share one origin: give v6.2 its own words, photos,
          # anonymous credentials, capture/scan state and service-worker cache.
          find site/v6.2 -type f \( -name '*.js' -o -name '*.html' \) -not -path '*/vendor/*' -print0 |
            xargs -0 sed -i \
              -e 's/lexicon-word-collector-v1/lexicon-word-collector-v62-standalone/g' \
              -e 's/wc-list-scroll-v1/wc-list-scroll-v62-standalone/g' \
              -e 's/word-collector-capture-request-v1/word-collector-capture-request-v62-standalone/g' \
              -e 's/word-collector-capture-started-v1/word-collector-capture-started-v62-standalone/g' \
              -e 's/word-collector-capture-queue-v1/word-collector-capture-queue-v62-standalone/g' \
              -e 's/word-collector-scan-selection-v1/word-collector-scan-selection-v62-standalone/g' \
              -e 's/word-collector-scan-field-v1/word-collector-scan-field-v62-standalone/g' \
              -e 's/word-collector-scan-learned-v1/word-collector-scan-learned-v62-standalone/g' \
              -e 's/wordcollector-photo-store-v1/wordcollector-photo-store-v62-standalone/g' \
              -e 's/word-collector-private-auth-v1/word-collector-private-auth-v62-standalone/g' \
              -e 's/word-collector-web-tester-session-v1/word-collector-web-tester-session-v62-standalone/g' \
              -e 's/word-collector-device-id-v1/word-collector-device-id-v62-standalone/g' \
              -e 's/word-collector-tester-auth-v1/word-collector-tester-auth-v62-standalone/g' \
              -e 's/wordcollector-public-static-/wordcollector-v62-static-/g'
          # Backup files keep the app's shared storage name, so a backup made in the
          # APK restores on this page and a backup made here restores in the APK.
          sed -i \
            -e "s/storageKey:KEY/storageKey:'lexicon-word-collector-v1'/" \
            -e "s/storageKey: KEY/storageKey: 'lexicon-word-collector-v1'/" \
            -e "s/obj.storageKey !== KEY/![KEY, 'lexicon-word-collector-v1'].includes(obj.storageKey)/" \
            site/v6.2/backup.js
          test "$(grep -c "storageKey: *'lexicon-word-collector-v1'" site/v6.2/backup.js)" = 2
          grep -Fq "![KEY, 'lexicon-word-collector-v1'].includes(obj.storageKey)" site/v6.2/backup.js
          grep -Fq "lexicon-word-collector-v62-standalone" site/v6.2/app.js
          grep -Fq "lexicon-word-collector-v62-standalone" site/v6.2/backup.js
          if grep -rlF --include=*.js --include=*.html 'lexicon-word-collector-v1' site/v6.2 | grep -qv '^site/v6.2/backup.js$'; then echo 'v6.2 still uses the shared word storage name'; exit 1; fi
          if grep -rlE --include=*.js --include=*.html '(wc-list-scroll|word-collector-(capture-request|capture-started|capture-queue|scan-selection|scan-field|scan-learned|private-auth|web-tester-session|device-id|tester-auth)|wordcollector-photo-store)-v1' site/v6.2; then echo 'v6.2 still uses a shared storage name'; exit 1; fi
          grep -Fq 'wordcollector-v62-static-' site/v6.2/sw.js
          if grep -Fq 'wordcollector-public-static-' site/v6.2/sw.js; then echo 'v6.2 still uses the root cache name'; exit 1; fi
          grep -Fq 'word-collector-api-v3.yechan-lim-elec.workers.dev' site/v6.2/analysis-api.js
          for f in app.js data.js sw.js backup.js photo-store.js anonymous-auth.js analysis-api.js; do node --check "site/v6.2/$f"; done
          test "$(find site/v6.2/assets/seed-photos -name 'term_*.jpg' | wc -l)" = 72
          test -s site/v6.2/index.html
          test -s site/V11.21/index.html
          test -s site/v3/index.html
          test -s site/v2.3-three-notebooks/index.html
          test "$(find site/eval -mindepth 1 -maxdepth 1 -type d | wc -l)" = 6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload public web assets
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-attempt-${{ github.run_attempt }}

      - name: Deploy approved web snapshot to existing Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}

      - name: Summarize deployment
