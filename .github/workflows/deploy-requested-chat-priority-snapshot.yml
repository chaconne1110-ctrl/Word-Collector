name: Deploy Word Collector V11.19 + power-engineering evaluation

# The main webapp remains pinned to V11.19. Publish only the power-engineering
# evaluation app under eval/power-engineering/, leaving the other five unpublished.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-requested-chat-priority-snapshot.yml'

permissions:
  contents: read

concurrency:
  group: word-collector-pages
  cancel-in-progress: false

jobs:
  deploy-requested-snapshot:
    name: Revalidate pinned V11.19 snapshot and redeploy Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout pinned requested branch revision
        uses: actions/checkout@v4
        with:
          ref: '3bb1ccf4f71bf82169d59db782f44eff4af0fd6e'
          persist-credentials: false

      - name: Checkout power-engineering evaluation app
        uses: actions/checkout@v4
        with:
          ref: '73dcfcf616a4ac87f596e8d75755a164bb7cb72e'
          path: eval-src/power-engineering
          persist-credentials: false

      - name: Verify immutable source revision and app assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3bb1ccf4f71bf82169d59db782f44eff4af0fd6e"
          test -s www/index.html
          test -s www/quick_capture/code.html
          test -s www/analysis-api.js
          test -s www/sw.js
          grep -q 'id="analysis-action-bar"' www/quick_capture/code.html
          ! grep -q 'id="tester-token"' www/quick_capture/code.html
          test "$(git -C eval-src/power-engineering rev-parse HEAD)" = "73dcfcf616a4ac87f596e8d75755a164bb7cb72e"
          test -s eval-src/power-engineering/www/index.html
          grep -q "lexicon-word-collector-v1-eval-power-engineering" eval-src/power-engineering/www/app.js
          node --check eval-src/power-engineering/www/data.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate source JS
        run: |
          node --check www/screen-scale.js
          node --check www/app.js
          node --check www/analysis-api.js
          node --check www/quick_capture/analysis.js
          node --check www/anonymous-auth.js
          node --check www/sw.js
          node --check www/evidence.js
          node --check www/native-back.js

      - name: Run regression tests with mocked API (no Gemini charges)
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/*.test.mjs

      - name: Assemble main webapp and one evaluation app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/eval
          cp -R www/. site/
          cp -R eval-src/power-engineering/www site/eval/power-engineering
          test -s site/index.html
          test -s site/eval/power-engineering/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload V11.19 and power-engineering evaluation
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-attempt-${{ github.run_attempt }}

      - name: Deploy approved web snapshot to existing Pages URL
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-attempt-${{ github.run_attempt }}

      - name: Summarize deployment
        shell: bash
        run: |
          echo "Deployed source branch: V11.19"
          echo "Deployed source SHA: 3bb1ccf4f71bf82169d59db782f44eff4af0fd6e"
          echo "Pages URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Power-engineering evaluation: ${{ steps.deployment.outputs.page_url }}eval/power-engineering/"
