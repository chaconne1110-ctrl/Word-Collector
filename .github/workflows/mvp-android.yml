name: Word Collector Capacitor Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/word-collector-mvp-20261104
    paths:
      - "www/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "android/**"
      - ".github/workflows/mvp-android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install locked application dependencies
        run: npm ci
      - name: Verify current application contracts
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/worker.test.mjs
      - name: Synchronize bundled web application
        run: npx --no-install cap sync android
      - name: Build Capacitor debug APK
        run: bash android/gradlew -p android assembleDebug --max-workers=2 --console=plain
      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: word-collector-capacitor-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
