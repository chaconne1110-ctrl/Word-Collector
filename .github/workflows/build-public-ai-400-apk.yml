name: Build public-ai-400-per-device APK

on:
  push:
    branches: [feature/public-ai-400-per-device]
    paths:
      - '.github/workflows/build-public-ai-400-apk.yml'
      - 'www/**'
      - 'cloudflare/**'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install exact application dependencies
        run: npm ci

      - name: Verify JS tests
        run: node --test tests/*.test.cjs server/test/*.test.cjs cloudflare/worker.test.mjs

      - name: Sync latest main www into Capacitor Android
        run: npx --no-install cap sync android

      - name: Ensure package ID and bundled UI are unchanged
        run: |
          grep -q '"appId":  *"com.yechan.wordcollector"' capacitor.config.json
          grep -q '"webDir":  *"www"' capacitor.config.json
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/analysis-api.js
          test -s android/app/src/main/assets/public/quick_capture/code.html
          ! grep -q 'id="tester-token"' android/app/src/main/assets/public/quick_capture/code.html
          test -s android/app/src/main/assets/public/assets/styles/layout-fixes.css
          grep -q 'id="analysis-action-bar"' android/app/src/main/assets/public/quick_capture/code.html

      - name: Build Android debug APK (not production signed)
        run: bash android/gradlew -p android assembleDebug --max-workers=2 --console=plain

      - name: Verify APK and prepare preview release files
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          VERSION="${GITHUB_SHA:0:7}"
          TAG="v1.1.0-public-ai-400-${VERSION}"
          NAME="WordCollector_PublicAI400_${VERSION}_Debug.apk"
          mkdir -p release
          cp "$APK" "release/$NAME"
          printf '%s  %s\n' "$(sha256sum "release/$NAME" | cut -d ' ' -f1)" "$NAME" > release/SHA256.txt
          {
            echo "# Word Collector 기기당 AI 400회 브랜치 미리보기 APK"
            echo
            echo "- 소스 브랜치 feature/public-ai-400-per-device: \`$GITHUB_SHA\`"
            echo "- 최신 4개 메뉴 HTML/Capacitor 앱과 Cloudflare HTTPS 연결 코드 포함"
            echo "- 이 APK는 GitHub Actions에서 생성한 **디버그 서명 테스트 빌드**이며 정식 배포 서명 APK가 아닙니다."
            echo "- 기존 설치 앱과 서명이 다르면 덮어쓰기 업데이트할 수 없습니다. **기존 앱을 삭제하거나 데이터를 초기화하지 마세요.**"
            echo "- 기존 데이터 보존, 기기 설치, Gemini API 실제 분석은 확인되지 않았습니다."
            echo "- AI 분석은 서버 인증 및 Cloudflare/Google API 정상 동작에 따라 별도로 실패할 수 있습니다."
          } > release/RELEASE_NOTES.md
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Upload APK as downloadable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: word-collector-public-ai-400-apk
          path: |
            release/*.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public GitHub prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "release/$RELEASE_NAME" release/SHA256.txt \
            --target "$GITHUB_SHA" \
            --title "Word Collector public AI 400/device preview ($RELEASE_TAG)" \
            --notes-file release/RELEASE_NOTES.md \
            --prerelease
