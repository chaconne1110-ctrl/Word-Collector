<script>
  // Simple interactions for collapsible accordions, format chip toggle, and count updates
  (function() {
    // Accordion Toggle
    const triggers = document.querySelectorAll('.accordion-trigger');
    triggers.forEach(trigger => {
      trigger.addEventListener('click', () => {
        const parentCard = trigger.closest('.subject-card');
        const content = parentCard.querySelector('.accordion-content');
        const icon = trigger.querySelector('.material-symbols-outlined');
        const isHidden = content.classList.contains('hidden');

        if (isHidden) {
          content.classList.remove('hidden');
          icon.style.transform = 'rotate(0deg)';
        } else {
          content.classList.add('hidden');
          icon.style.transform = 'rotate(180deg)';
        }
      });
    });

    // Format Chips Single Select
    const chips = document.querySelectorAll('.format-chip');
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        chips.forEach(c => {
          c.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');
          c.classList.add('bg-surface-container', 'text-on-surface');
          const subText = c.querySelector('.text-\\[10px\\]');
          if (subText) subText.classList.replace('opacity-90', 'text-on-surface-variant');
        });
        chip.classList.remove('bg-surface-container', 'text-on-surface');
        chip.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');
        const activeSub = chip.querySelector('.text-\\[10px\\]');
        if (activeSub) activeSub.classList.replace('text-on-surface-variant', 'opacity-90');
      });
    });

    // Word Counter & Master Sync simulation
    const wordBoxes = document.querySelectorAll('.word-checkbox');
    const globalCountText = document.getElementById('globalSelectedCount');
    const exportBtn = document.getElementById('exportActionBtn');

    function updateCount() {
      const selected = document.querySelectorAll('.word-checkbox:checked').length;
      // Scaled count display to represent 38 base items
      const displayTotal = 30 + selected * 2;
      globalCountText.textContent = `${displayTotal}개 단어 선택됨`;
      const btnSpan = exportBtn.querySelector('span:last-child');
      if (btnSpan) {
        btnSpan.textContent = `${displayTotal}개 단어 스프레드시트 추출 및 다운로드`;
      }
    }

    wordBoxes.forEach(box => {
      box.addEventListener('change', updateCount);
    });

    // Subject Master Checkbox Logic
    const subjectBoxes = document.querySelectorAll('.subject-checkbox');
    subjectBoxes.forEach(sBox => {
      sBox.addEventListener('change', (e) => {
        const subId = sBox.dataset.subject;
        const matchingWords = document.querySelectorAll(`.word-checkbox[data-parent="${subId}"]`);
        matchingWords.forEach(w => w.checked = e.target.checked);
        updateCount();
      });
    });

    // Global Master Checkbox Logic
    const masterBox = document.getElementById('selectAllMaster');
    if (masterBox) {
      masterBox.addEventListener('change', (e) => {
        const checked = e.target.checked;
        document.querySelectorAll('.subject-checkbox, .word-checkbox').forEach(cb => {
          cb.checked = checked;
        });
        updateCount();
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-4px_16px_rgba(19,27,46,0.05)]" data-active-classes="text-primary font-semibold"><div class="grid grid-cols-4 items-center h-16 px-2"><a class="flex flex-col items-center justify-center gap-1 h-full min-h-[44px] text-on-surface-variant hover:text-primary transition-all" data-path="home" href="../index.html"><span class="material-symbols-outlined text-[24px]">home</span><span class="text-[11px] font-body tracking-tight leading-none">홈</span></a><a class="flex flex-col items-center justify-center gap-1 h-full min-h-[44px] text-on-surface-variant hover:text-primary transition-all" data-path="word-add" href="../quick_capture/code.html"><span class="material-symbols-outlined text-[24px]">add_circle</span><span class="text-[11px] font-body tracking-tight leading-none">단어 추가</span></a><a class="flex flex-col items-center justify-center gap-1 h-full min-h-[44px] text-on-surface-variant hover:text-primary transition-all" data-path="bookmarks" href="../bookmarks.html"><span class="material-symbols-outlined text-[24px]">bookmark</span><span class="text-[11px] font-body tracking-tight leading-none">북마크</span></a><a aria-current="page" class="flex flex-col items-center justify-center gap-1 h-full min-h-[44px] transition-all text-primary font-semibold" data-path="spreadsheet-export" href="../_6/code.html"><span class="material-symbols-outlined text-[24px]">print</span><span class="text-[11px] font-body tracking-tight leading-none">출력</span></a></div></nav>
