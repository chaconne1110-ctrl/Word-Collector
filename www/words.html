<dialog id="rename-notebook-dialog" aria-labelledby="rename-notebook-title" style="margin:auto;width:calc(100% - 2rem);max-width:24rem;padding:1.5rem;border:1px solid #dbe1f0;border-radius:1rem;background:#fff;color:#131b2e;">
<form id="rename-notebook-form" style="display:flex;flex-direction:column;gap:1rem;">

<label for="notebook-name">단어장 이름</label>
<input id="notebook-name" name="notebookName" required maxlength="60" autocomplete="off" style="width:100%;padding:.75rem;border:1px solid #c4cbe0;border-radius:.5rem;" />
<div style="display:flex;justify-content:flex-end;gap:.5rem;">
<button id="cancel-notebook-rename" type="button" style="padding:.6rem 1rem;border-radius:.5rem;background:#eef0fa;">취소</button>

</div>
<button id="delete-notebook" type="button" style="display:flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.75rem;border-radius:.5rem;background:#ffdad6;color:#ba1a1a;font-weight:600;"><span class="material-symbols-outlined">delete</span>단어장 삭제</button>
</form>
</dialog>

</div></div>
