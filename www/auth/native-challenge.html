<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Word Collector 자동 인증</title>
<style>
  html,body{font-family:system-ui,sans-serif;color:#152134;margin:0;background:#fff}
  main{padding:14px} h1{font-size:16px;margin:0 0 8px} p{font-size:13px;margin:8px 0}
  #verification{min-height:78px;margin-top:12px} #status{color:#38445b}
</style>
</head>
<body><main>
<h1>AI 자동 인증</h1>
<p>보안 검증을 완료하면 앱으로 자동 복귀합니다. 승인 코드는 필요하지 않습니다.</p>
<div id="verification"></div>
<p id="status" role="status">보안 검증을 준비하고 있습니다.</p>
</main>
<script>
(async () => {
  'use strict';
  const parents = new Set(['https://localhost','capacitor://localhost']);
  const parentOrigin = new URL(location.href).searchParams.get('parentOrigin');
  const status = document.getElementById('status');
  if (!parents.has(parentOrigin) || window.parent === window) {
    status.textContent = '이 페이지는 Word Collector 앱에서만 사용합니다.';
    return;
  }
  function send(token) {
    window.parent.postMessage({type:'wordcollector-turnstile-v1',token},parentOrigin);
  }
  try {
    const response = await fetch('https://word-collector-api.yechan-lim-elec.workers.dev/api/auth/config',{cache:'no-store'});
    const config = await response.json();
    if (!response.ok || config.enabled !== true || typeof config.siteKey !== 'string') throw Error('자동 인증이 아직 활성화되지 않았습니다.');
    await new Promise((resolve,reject) => {
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      script.onload = resolve;
      script.onerror = reject;
      document.head.append(script);
    });
    if (!window.turnstile?.render) throw Error('Turnstile을 시작하지 못했습니다.');
    window.turnstile.render(document.getElementById('verification'),{
      sitekey:config.siteKey,action:'wordcollector-auth',execution:'execute',appearance:'always',
      size:'flexible',
      callback:token => {status.textContent='보안 검증이 완료되었습니다.';send(token);},
      'error-callback':() => {status.textContent='보안 검증에 실패했습니다. 다시 시도해 주세요.';send('');return true;},
      'expired-callback':() => {status.textContent='검증이 만료되었습니다. 다시 시도해 주세요.';send('');}
    });
    window.turnstile.execute(document.getElementById('verification'));
    status.textContent = '자동 인증을 확인하고 있습니다.';
  } catch (error) {
    status.textContent = error?.message || '자동 인증을 완료하지 못했습니다.';
    send('');
  }
})();
</script>
</body>
</html>
