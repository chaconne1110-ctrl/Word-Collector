<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>단어장 CSV·XLSX 내보내기</title>
  <style>
    *{box-sizing:border-box}body{font:16px/1.6 system-ui,sans-serif;background:#faf8ff;color:#131b2e;margin:0}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:24px}label{display:block;margin:16px 0}select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #aab3ce}select{width:100%;background:white;color:inherit}button{background:#00236f;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:10px}.secondary{background:#eaedff;color:#131b2e}textarea{width:100%;height:260px;font:13px/1.5 monospace;padding:12px}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#444651}a{color:#00236f}
  </style>
</head>
<body><main>
  <a href="index.html">← 홈으로</a>
  <h1>단어장 CSV·XLSX 내보내기</h1>
  <p>검수 후 저장한 최신 단어를 Excel·Google 스프레드시트에서 열 수 있는 파일로 저장합니다.</p>
  <label for="course">단어장<select id="course"></select></label>
  <label for="layout">열 구성<select id="layout">
    <option value="basic">팀 기본 8열</option>
    <option value="ai">입력 단어 + AI 검수 7항목</option>
  </select></label>
  <p id="columns"></p>
  <p><small>미입력 항목은 빈 칸입니다. AI 형식의 최초 입력 원문은 originalTerm 필드를 사용하며, 기존에 저장되지 않은 원문을 임의로 추정하지 않습니다.</small></p>
  <p id="count" aria-live="polite"></p>
  <div class="actions">
    <button id="export" data-format="csv" type="button">CSV로 저장</button>
    <button id="export-xlsx" data-format="xlsx" type="button">XLSX로 저장</button>
    <button id="refresh" class="secondary" type="button">목록 새로고침</button>
  </div>
  <p><small>현재 앱·브라우저에 저장된 단어를 사용합니다. 저장 내용이 없으면 앱의 기본 예시 단어를 표시합니다. 내보내기는 원본 단어를 변경하지 않습니다.</small></p>
  <label for="preview">CSV 미리보기·복사<textarea id="preview" readonly spellcheck="false"></textarea></label>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script src="data.js"></script>
<script src="word-export.js"></script>
<script src="csv-export.js"></script>
</body></html>
